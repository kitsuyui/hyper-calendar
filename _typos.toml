# typos is a source code spell checker
# https://github.com/crate-ci/typos
#
# This repository stores the world's calendar vocabulary as string data, so a
# great many of its "words" are German, Dutch, Polish, Vietnamese, Bengali,
# romanised Chinese or Japanese, or standards abbreviations that an English
# dictionary would happily "correct" into unrelated words. Every entry below is
# a real word or identifier in the language or standard it belongs to.
#
# typos does not merge nested configuration files: a `_typos.toml` inside a
# crate silences a run rooted at that crate and is ignored by a run rooted at
# the repository, which is what CI does. So this is the only such file in the
# workspace, and a new crate's vocabulary belongs here rather than beside it.

[files]
# line_digests.txt and line_digests_holidays.txt are hexadecimal FNV-1a
# digests, whose runs of letters are not words and change whenever a
# calendar or a holiday table does.
# The line digests are generated hexadecimal hashes, and a hash can spell a
# "misspelling" such as `caf`.
# hc-i18n's place_names/cldr48.rs is generated from CLDR 48 by
# scripts/place-names-cldr.py: some 130 000 names of places in 45 languages
# (Czech "provincie", Dutch "departement") and ISO 3166-2 codes run
# together in fixed-width records (`GH-OT`, `PE-SAMPE-TAC`), none of them
# English words, and a generator's output is checked against CLDR, not
# corrected by hand.
# hc-i18n's zone_names/cldr48.rs is generated from CLDR 48 by
# scripts/zone-names-cldr.py: the metazone names of 55 locales (Indonesian
# "Standar", Turkish "Standart", French "normale"), checked against CLDR
# rather than corrected by hand.
extend-exclude = [
    "Cargo.lock",
    "crates/hc-i18n/src/place_names/cldr48.rs",
    "crates/hc-i18n/src/zone_names/cldr48.rs",
    "crates/hyper-calendar/tests/line_digests.txt",
    "crates/hyper-calendar/tests/line_digests_holidays.txt",
]

[default]
# *Shaʿot zmaniyot*, temporal hours, in hc-astro's zmanim: typos splits the
# word at the ʿ, and its second half is not a word worth allowing everywhere.
# Nigerian Pidgin "Puẹ́rto Ríkọ", Puerto Rico, a CLDR 48 exemplar city in
# hc-i18n's `exemplar_cities`: typos splits the word at the combining acute
# and reads its tail, "rto", as a misspelling.
extend-ignore-re = ["[Ss]haʿot", "Puẹ́rto"]

