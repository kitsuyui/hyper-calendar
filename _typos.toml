# typos is a source code spell checker
# https://github.com/crate-ci/typos
#
# This repository stores the world's calendar vocabulary as string data, so a
# great many of its "words" are German, Dutch, Polish, Vietnamese, Bengali,
# romanised Chinese or Japanese, or standards abbreviations that an English
# dictionary would happily "correct" into unrelated words. Every entry below is
# a real word or identifier in the language or standard it belongs to.
#
# typos does not merge nested configuration files: a `_typos.toml` inside a
# crate silences a run rooted at that crate and is ignored by a run rooted at
# the repository, which is what CI does. So this is the only such file in the
# workspace, and a new crate's vocabulary belongs here rather than beside it.

[files]
extend-exclude = ["Cargo.lock"]

[default.extend-words]
# BSE, the Bombay Stock Exchange's own name for itself, and the identifier
# of its rule set.
BSE = "BSE"
# Garant, the Russian legal database that publishes the Government's decrees.
Garant = "Garant"
# St Peter Chanel, martyr of Futuna, in the General Roman Calendar.
Chanel = "Chanel"
# St Achilleus, martyr with St Nereus, in the General Roman Calendar.
Achilleus = "Achilleus"
# Spanish "Decreto Legislativo", Peru's legislative decree.
Legislativo = "Legislativo"
# The Macao Government's English spelling of the Tung Ng Festival.
Tung = "Tung"
# Arica, the Chilean city and region.
Arica = "Arica"
# Spanish "Protestantes" in the name of a Chilean holiday.
Protestantes = "Protestantes"
# Spanish "Registro Oficial", Ecuador's official gazette.
Oficial = "Oficial"
# Spanish "legislación", in legislacion.asamblea.gob.ni, the host of
# Nicaragua's Normas Jurídicas.
legislacion = "legislacion"
# Spanish "Día Internacional del Trabajo" and "Símbolos Patrios".
Internacional = "Internacional"
Patrios = "Patrios"
# Romanian "pe stil vechi", the old style, in Moldova's Christmas.
stil = "stil"
# Swahili "Nane Nane", the eighth of the eighth, Tanzania's farmers' day.
Nane = "Nane"
# French "Réconciliation Nationales", in the name of Burundi's Unity Day.
Nationales = "Nationales"
# Fo, the first day of the Akan six-day week.
Fo = "Fo"
# German and Dutch month names.
Januar = "Januar"
Februar = "Februar"
Juni = "Juni"
Juli = "Juli"
Oktober = "Oktober"
Dezember = "Dezember"
juni = "juni"
juli = "juli"
oktober = "oktober"
# Polish "sierpień", abbreviated.
sie = "sie"
# The World Health Assembly, cited by its resolutions.
WHA = "WHA"
# Tongan "ʻaloʻi", born, in the names of the royal birthdays.
alo = "alo"
# Samoan and Tuvaluan "aso", day, as in "Aso Tutoʻatasi" and "Te Aso o te Tala Lei".
Aso = "Aso"
# Vietnamese "Thứ Ba", Tuesday.
Ba = "Ba"
# The CLDR identifier of the Bengali numbering system.
beng = "beng"
BENG = "BENG"
# 干支, the sexagenary cycle, romanised from Japanese.
eto = "eto"
# India Standard Time, and the other zone abbreviations typos mistakes for
# English words.
IST = "IST"
# 彼岸明け, the last day of the equinoctial week, romanised as "higan-ake".
ake = "ake"
# Relative-time vocabulary. German "vor 3 Tagen", "Tage", "ein"; Danish and
# Dutch "als" and "alle"; Spanish "hace 3 dias"; French and Dutch "seconde";
# Czech "dne"/"dny" and "minut"; Welsh "mis"/"fis" for month; Indonesian "thn"
# and Welsh "wth" as narrow unit abbreviations.
vor = "vor"
als = "als"
ein = "ein"
Tage = "Tage"
hace = "hace"
seconde = "seconde"
dne = "dne"
minut = "minut"
alle = "alle"
mis = "mis"
thn = "thn"
wth = "wth"
# Valles Marineris.
Marineris = "Marineris"
# French "exercice" (the financial year) and "sur", both in the quoted text of
# LOLF article 1; Claus Tøndering, cited for the Birashk cycle.
exercice = "exercice"
sur = "sur"
# French "maintenant" — "just now" in the relative-time data.
maintenant = "maintenant"
Claus = "Claus"
# Balinese Buda (Wednesday in the Pawukon), not the Buddha.
Buda = "Buda"
buda = "buda"
# Japanese era names: 仁安 Nin'an, 文治 Bunji.
Nin = "Nin"
Bunji = "Bunji"
bunji = "bunji"
# 亥 in the Korean Revised Romanisation of the earthly branches.
hae = "hae"
# Holiday names in their own languages. French "Assomption" and "pont";
# Dutch "Onze Lieve Vrouw"; Danish and Norwegian "Grundlovsdag" and
# "Lov", "lov", "som"; Vietnamese "Viet Nam".
Assomption = "Assomption"
pont = "pont"
Lieve = "Lieve"
Lov = "Lov"
lov = "lov"
som = "som"
Nam = "Nam"
# A tuplet is a group of notes played in the time of a different number of
# them — a triplet is one. Not a misspelling of "tuple".
tuplets = "tuplets"
tuplet = "tuplet"
# Latin: "stilus nativitatis", the Nativity style of dating. Not the pen.
stilus = "stilus"
# ACI Prensa, the Catholic news agency cited for Cuba's Good Fridays.
ACI = "ACI"
# German "Handel", trade, in the title of Liechtenstein's Labour Act.
Handel = "Handel"
# Catalan "Associats" in the name of an Andorran firm cited as a source.
Associats = "Associats"
# Bengali "Prothom Alo", the Dhaka daily newspaper cited as a source.
Alo = "Alo"
# Dutch "Chinees Nieuwjaar", Chinese New Year, in Suriname's Besluit Vrije
# Dagen 1971.
Chinees = "Chinees"
# Italian "successivo", following: Vatican City's "Giorno successivo
# all'Assunzione".
successivo = "successivo"
# Portuguese "Jornal da República", Timor-Leste's official gazette, and
# "Datas Oficiais Comemorativas", official commemorative dates, in the
# title of its holidays law.
Jornal = "Jornal"
Datas = "Datas"
# Portuguese "Datas de Celebração Nacional", national celebration dates, in
# the title of Angola's holidays law, and "Novo Jornal", the Luanda weekly
# cited as a source.
# French "Fonction publique", the civil service, in the name of
# Mauritania's Ministère de la Fonction Publique et du Travail.
Fonction = "Fonction"
# French "s'aligne", aligns itself, in the title of the Cridem article on
# Mauritania's 2014 weekend change.
aligne = "aligne"
# French, in the passages of Comte's Calendrier positiviste (1852) the
# Positivist module quotes: "je n'attribue", "chaque mois y commencera", the
# "culte concret", and the month Aristote.
attribue = "attribue"
commencera = "commencera"
concret = "concret"
Aristote = "Aristote"
ARISTOTE = "ARISTOTE"
# Latvian given names in the Valsts valodas centrs's name-day lists
# (hc-name-days), each a real name on a real day: Justs (28 February),
# Alise (4 March), Tilda (14 March), and the rest from the extended list.
Justs = "Justs"
Alise = "Alise"
Alis = "Alis"
Ane = "Ane"
Daimonds = "Daimonds"
Ede = "Ede"
Heda = "Heda"
Lins = "Lins"
Makss = "Makss"
Mena = "Mena"
Monts = "Monts"
Rute = "Rute"
Sigits = "Sigits"
Tilda = "Tilda"
Udo = "Udo"
Valentins = "Valentins"
Vendeta = "Vendeta"
Emets = "Emets"
Konors = "Konors"
Nils = "Nils"
Ints = "Ints"
Ako = "Ako"
Vits = "Vits"
