# typos is a source code spell checker
# https://github.com/crate-ci/typos
#
# This repository stores the world's calendar vocabulary as string data, so a
# great many of its "words" are German, Dutch, Polish, Vietnamese, Bengali,
# romanised Chinese or Japanese, or standards abbreviations that an English
# dictionary would happily "correct" into unrelated words. Every entry below is
# a real word or identifier in the language or standard it belongs to.
#
# typos does not merge nested configuration files: a `_typos.toml` inside a
# crate silences a run rooted at that crate and is ignored by a run rooted at
# the repository, which is what CI does. So this is the only such file in the
# workspace, and a new crate's vocabulary belongs here rather than beside it.

[files]
extend-exclude = ["Cargo.lock"]

[default.extend-words]
# German and Dutch month names.
Januar = "Januar"
Februar = "Februar"
Juni = "Juni"
Juli = "Juli"
Oktober = "Oktober"
Dezember = "Dezember"
juni = "juni"
juli = "juli"
oktober = "oktober"
# Polish "sierpień", abbreviated.
sie = "sie"
# Vietnamese "Thứ Ba", Tuesday.
Ba = "Ba"
# The CLDR identifier of the Bengali numbering system.
beng = "beng"
BENG = "BENG"
# 干支, the sexagenary cycle, romanised from Japanese.
eto = "eto"
# India Standard Time, and the other zone abbreviations typos mistakes for
# English words.
IST = "IST"
# 彼岸明け, the last day of the equinoctial week, romanised as "higan-ake".
ake = "ake"
# Relative-time vocabulary. German "vor 3 Tagen", "Tage", "ein"; Danish and
# Dutch "als" and "alle"; Spanish "hace 3 dias"; French and Dutch "seconde";
# Czech "dne"/"dny" and "minut"; Welsh "mis"/"fis" for month; Indonesian "thn"
# and Welsh "wth" as narrow unit abbreviations.
vor = "vor"
als = "als"
ein = "ein"
Tage = "Tage"
hace = "hace"
seconde = "seconde"
dne = "dne"
minut = "minut"
alle = "alle"
mis = "mis"
thn = "thn"
wth = "wth"
# Valles Marineris.
Marineris = "Marineris"
# Balinese Buda (Wednesday in the Pawukon), not the Buddha.
Buda = "Buda"
buda = "buda"
# Japanese era names: 仁安 Nin'an, 文治 Bunji.
Nin = "Nin"
Bunji = "Bunji"
bunji = "bunji"
# 亥 in the Korean Revised Romanisation of the earthly branches.
hae = "hae"
# Holiday names in their own languages. French "Assomption" and "pont";
# Dutch "Onze Lieve Vrouw"; Danish and Norwegian "Grundlovsdag" and
# "Lov", "lov", "som"; Vietnamese "Viet Nam".
Assomption = "Assomption"
pont = "pont"
Lieve = "Lieve"
Lov = "Lov"
lov = "lov"
som = "som"
Nam = "Nam"
