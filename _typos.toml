Mayu = "Mayu"
yau = "yau"
Estoniya = "Estoniya"
Kazakstan = "Kazakstan"
# hc-holiday and docs/systems/tibetan-calendar-holidays.md: Haa, a district
# of Bhutan (BT-13); docs/references.bib: Ned Gagahe, the Island Sun's
# reporter.
Haa = "Haa"
Ned = "Ned"
# hc-almanac::direction_deities: 姫金神, the princess 金神, read hime.
hime = "hime"
