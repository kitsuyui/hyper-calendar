[package]
name = "hc-seasons"
description = "Seasonal subdivisions for hyper-calendar: the 24 solar terms, the 72 pentads, zassetsu and moon-phase calendars."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true

[features]
default = ["std"]
# Add `lunisolar::exact_lunisolar_day`, the Tenpō reading to compare the
# simplified derivation against. Nothing routes through it. Off by default: a
# caller who wants only the solar terms should not compile the lunisolar
# calendars to get them.
lunar = ["dep:hc-calendars-lunar"]
std = ["alloc", "hc-core/std", "hc-calendar/std", "hc-astro/std", "hc-calendars-lunar?/std"]
alloc = ["hc-core/alloc", "hc-calendar/alloc", "hc-astro/alloc", "hc-calendars-lunar?/alloc"]

[dependencies]
hc-core = { workspace = true }
hc-calendar = { workspace = true }
hc-astro = { workspace = true }
hc-calendars-lunar = { workspace = true, optional = true }
