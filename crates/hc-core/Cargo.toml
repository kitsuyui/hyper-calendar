[package]
name = "hc-core"
description = "Core time primitives for hyper-calendar: exact durations, uniform time scales (TAI/TT/TCG/TDB/TCB/GPS), leap seconds and epochs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true

[features]
default = ["std"]
std = ["alloc"]
alloc = []
# The per-call memo of `memo`: without it, or without `std`, every memoized
# function computes every time. Off by default so that a WebAssembly layer
# that never opens a memo scope does not carry the memo's code; the facade
# turns it on with the calendars that search the sky.
memo = []
# Floating-point math for `no_std` builds. Enable this instead of `std` when
# targeting bare metal or a minimal WebAssembly runtime.
libm = ["dep:libm"]

[dependencies]
libm = { version = "0.2", optional = true, default-features = false }

[lints.rust]
# `cargo llvm-cov` sets `cfg(coverage)`; `sweep::INSTRUMENTED` reads it.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }
