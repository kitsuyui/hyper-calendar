[package]
name = "hc-holiday"
description = "Holiday and observance engine for hyper-calendar: a rule language plus per-country and per-religion rule sets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true

[features]
default = ["std"]
std = ["alloc", "hc-core/std", "hc-calendar/std", "hc-calendars-solar/std", "hc-calendars-lunar/std", "hc-calendars-equinox/std", "hc-calendars-indic/std", "hc-calendars-regional/std", "hc-astro/std", "hc-seasons/std"]
alloc = ["hc-core/alloc", "hc-calendar/alloc", "hc-calendars-solar/alloc", "hc-calendars-lunar/alloc", "hc-calendars-equinox/alloc", "hc-calendars-indic/alloc", "hc-calendars-regional/alloc", "hc-astro/alloc", "hc-seasons/alloc"]

[dependencies]
hc-core = { workspace = true }
hc-calendar = { workspace = true }
hc-calendars-solar = { workspace = true }
hc-calendars-lunar = { workspace = true }
hc-calendars-equinox = { workspace = true }
hc-calendars-indic = { workspace = true }
hc-calendars-regional = { workspace = true }
hc-astro = { workspace = true }
hc-seasons = { workspace = true }
