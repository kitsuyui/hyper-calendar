[package]
name = "hc-format"
description = "Parsing and formatting for hyper-calendar: ISO 8601, RFC 3339, RFC 5322, ISO durations and intervals."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true

[features]
default = ["std"]
std = ["alloc", "hc-core/std", "hc-calendar/std", "hc-calendars-solar/std", "hc-tz/std", "hc-i18n/std"]
alloc = ["hc-core/alloc", "hc-calendar/alloc", "hc-calendars-solar/alloc", "hc-tz/alloc", "hc-i18n/alloc"]
# Floating-point math for `no_std` builds: `hc-core` refuses to compile with
# neither `std` nor `libm`.
libm = ["hc-core/libm"]
# The time zone names of the CLDR fields `z`, `v` and `V`: CLDR 48's
# metazones and English's names (`hc_i18n::zone_names`). Without it those
# fields take their UTS #35 fallbacks, the localized GMT format and `unk`.
zone-names = ["hc-i18n/zone-names"]
# Every other carried locale's zone names and exemplar cities.
localized-zone-names = ["zone-names", "hc-i18n/localized-zone-names"]

[dependencies]
hc-core = { workspace = true }
hc-calendar = { workspace = true }
hc-calendars-solar = { workspace = true }
hc-tz = { workspace = true }
hc-i18n = { workspace = true }
