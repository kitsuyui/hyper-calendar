[package]
name = "hc-planetary"
description = "Non-terrestrial time for hyper-calendar: Mars sols, MSD, MTC, the Darian calendars, circad calendars for Titan and the Galilean moons, and other planetary bodies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true

[features]
default = ["std"]
std = ["alloc", "hc-core/std", "hc-calendar/std", "hc-astro/std"]
alloc = ["hc-core/alloc", "hc-calendar/alloc", "hc-astro/alloc"]
# Floating-point math for `no_std` builds: `hc-core` refuses to compile with
# neither `std` nor `libm`.
libm = ["hc-core/libm"]

[dependencies]
hc-core = { workspace = true }
hc-calendar = { workspace = true }
hc-astro = { workspace = true }
