[package]
name = "hyper-calendar-ffi"
description = "A C ABI shared library for hyper-calendar."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true

[lib]
# The library is `hyper_calendar_ffi`, so the artefacts are
# `libhyper_calendar_ffi.{so,dylib,a}` and `hyper_calendar_ffi.dll`. It cannot
# be `hyper_calendar`: that is the facade's library name, and two libraries of
# one name in a workspace collide in `cargo doc` output.
crate-type = ["cdylib", "staticlib", "rlib"]

# The layers, the same as the WebAssembly module's. Every entry point is
# gated by one of these, and the README's table says which.
[features]
default = ["civil"]
# Proleptic Gregorian dates, ISO 8601 text and the TAI-UTC bridge.
civil = ["hc/civil"]
# Time-scale labels and day counts outside the civil calendar: TAI64
# labels, GNSS weeks, GLONASS dates, OLE Automation dates and Excel 1900
# serials. A layer of its own so that `civil`, the first a page paints
# with, does not carry their float formatting and 128-bit arithmetic.
timestamps = ["civil"]
# Every calendar the facade registers, described for one day in a locale.
calendars = ["civil", "hc/lunar", "hc/equinox", "hc/indic", "hc/regional", "hc/i18n", "hc/format"]
# The holiday tables: countries, exchanges, traditions and the UN days.
holiday = ["civil", "hc/holiday"]
# The 24 solar terms and the 72 pentads.
seasons = ["civil", "hc/seasons"]
# Cosmic, geologic and archaeological time.
deep-time = ["hc/deep-time"]
# The day by a time zone's wall clock: seventeen built-in zones, and any
# zone a caller loads as TZif bytes.
tz = ["civil", "hc/tz"]
# The sky: where the Sun and Moon are at an instant, and the solar terms and
# the moon phases within a span, from hc-astro's series.
sky = ["civil", "hc/seasons"]
# The orbit: Earth's orbital elements and the June insolation at 65° N, a
# million years either side of 1950, from Berger's 1978 series.
orbital = ["hc/orbital"]
# Every layer.
full = ["civil", "timestamps", "calendars", "holiday", "seasons", "deep-time", "tz", "sky", "orbital", "hc/full"]

[dependencies]
# Aliased to `hc`, as in `hyper-calendar-wasm`, to keep paths short.
hc = { package = "hyper-calendar", version = "0.1.0", path = "../hyper-calendar", default-features = false, features = ["std"] }
