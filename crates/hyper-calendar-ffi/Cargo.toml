[package]
name = "hyper-calendar-ffi"
description = "A C ABI shared library for hyper-calendar."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true

[lib]
# The library is `hyper_calendar_ffi`, so the artefacts are
# `libhyper_calendar_ffi.{so,dylib,a}` and `hyper_calendar_ffi.dll`. It cannot
# be `hyper_calendar`: that is the facade's library name, and two libraries of
# one name in a workspace collide in `cargo doc` output.
crate-type = ["cdylib", "staticlib", "rlib"]

# The layers, the same as the WebAssembly module's. Every entry point is
# gated by one of these, and the README's table says which.
[features]
default = ["civil"]
# Proleptic Gregorian dates, ISO 8601 text, POSIX time and the TAI-UTC bridge.
civil = ["hc/civil", "hc/format"]
# Time-scale labels and day counts outside the civil calendar: TAI64
# labels in both conventions, GNSS weeks, GLONASS dates, OLE Automation
# dates, Excel 1900 serials, UUID timestamps, NTP eras, FAT date and time
# words, Swatch Internet Time, Julian and Besselian epochs, TT(BIPM) from
# a caller's series, .NET ticks, and the Ethiopian and Swahili six-hour
# clocks. A layer of its own so that `civil`, the first a page paints with, does not carry
# their float formatting and 128-bit arithmetic.
timestamps = ["civil"]
# The CCSDS time codes, binary and ASCII, and the long-wave radio time
# codes of JJY, DCF77 and WWVB, read and written. A layer of their own, so
# that `timestamps` stays small for a page that needs only POSIX, ISO and
# TAI conversions.
time-codes = ["civil"]
# Every calendar the facade registers, described for one day in a locale;
# Rāhu kālam and the almanac's cycles of a day, 恵方, 三元九運 and 손 없는 날;
# and, in a build with `tz` too, each zone's exemplar city in the locale.
calendars = ["civil", "hc/lunar", "hc/equinox", "hc/indic", "hc/regional", "hc/almanac", "hc/i18n", "hc/format", "hc/localized-exemplar-cities"]
# The holiday tables: countries, exchanges, traditions and the UN days;
# and the Eastern Orthodox fasts.
holiday = ["civil", "hc/holiday"]
# The 24 solar terms and the 72 pentads.
seasons = ["civil", "hc/seasons"]
# Cosmic, geologic and archaeological time, the earliest evidence of life,
# of Homo sapiens and of writing, and the events of the far future.
deep-time = ["hc/deep-time"]
# The day by a time zone's wall clock, from eighteen built-in zones and
# any zone a caller loads as TZif bytes; and where each zone is, from
# tzdata's zone1970.tab, zone.tab and backward, with its exemplar city in
# English, or in the locale when the build has `calendars` or `zone-names` too.
tz = ["civil", "hc/tz"]
# The sky: where the Sun and Moon are at an instant, the decan the Sun is
# in, and the solar terms and the moon phases within a span; the Earth's
# rotation angle, sidereal time and UT2; solar time, sunrise, sunset and
# the other solar events under a named horizon; and the heliocentric
# Julian date; the Islamic prayer times, the zmanim and the Edo hours;
# from hc-astro's series. hc-i18n names the horizons in a locale.
sky = ["civil", "hc/seasons", "hc/i18n"]
# The orbit: Earth's orbital elements and the June insolation at 65° N, a
# million years either side of 1950, from Berger's 1978 series.
orbital = ["hc/orbital"]
# Jupiter: where it is at an instant, tropical and sidereal; its entries
# into the sidereal signs; and the Kumbh Mela and Pushkaram found from them,
# where `calendars`' `hc_kumbh` and `hc_pushkaram` take Jupiter's sign from the
# caller. From the complete VSOP87B series for Jupiter, some 55 kB of tables
# that no other layer carries.
jupiter = ["civil", "hc/jupiter"]
# Time on other bodies: Mars time and the Darian date, the surface
# missions' sol counts, the solar day and local mean solar time of every
# body in hc-planetary's table, and the dates of the Titan, Galilean and
# Martiana calendars.
planetary = ["hc/planetary"]
# Relativistic time dilation: a clock at a constant velocity, and one held
# still at a radius from a mass, from hc-relativity. A layer of its own, not
# part of `planetary`, because neither needs the other's crates.
relativity = ["hc/relativity"]
# What each locale calls every territory and every ISO 3166-2 subdivision,
# from CLDR 48: some 2.8 MB of names in 45 languages, so a layer of its own
# that a caller loads only to show place names.
places = ["hc/place-names"]
# Human-readable time from hc-humanize: how one instant reads from
# another, "3 hours ago"; which calendar day a day is, seen from another,
# "yesterday at 15:05"; and how long a span is, "2 hours and 30 minutes";
# in every locale hc-humanize carries. A layer of its own, since no other
# layer needs hc-humanize's phrases.
humanize = ["civil", "hc/humanize"]
# The number, size, list and time functions of Python's `humanize`, with
# its 35 gettext catalogues, in the locale's catalogue. A layer of its own:
# the catalogues are text that `humanize` does not need.
natural = ["civil", "hc/humanize"]
# ISO 8601 beyond a calendar date: date-times with a zone, durations,
# intervals, RFC 3339, RFC 2822, Python's `isoformat` and `strptime` and CLDR
# patterns. A layer of its own, so that `civil` stays small.
datetime = ["civil"]
# `strptime` and CLDR patterns read against a text, in the C locale's names
# or a locale's. A layer of its own: it needs every carried locale's names.
patterns = ["civil", "hc/i18n"]
# Time zone names: a zone's name at an instant in a locale, as the CLDR
# pattern fields z, O, v and V write it, from CLDR 48's metazones and zone
# names in every locale hc-i18n carries. Some 600 kB of names, so a layer
# of its own beside `tz`, which it builds on.
zone-names = ["tz", "hc/localized-zone-names"]
# Every layer, and nothing else: each layer names the facade features its
# exports need, so `full` needs none of its own. The facade's `full` would
# add `units`, `fiscal`, `attributes`, `name-days` and `uncertainty`'s
# re-exports, which no export reads, so it is not here. `places` is a
# layer like the others and is in; a program that needs no place names
# builds the layers it calls instead.
full = ["civil", "timestamps", "time-codes", "calendars", "holiday", "seasons", "deep-time", "tz", "sky", "orbital", "jupiter", "planetary", "relativity", "places", "humanize", "natural", "datetime", "patterns", "zone-names"]

[dependencies]
# Aliased to `hc`, as in `hyper-calendar-wasm`, to keep paths short.
hc = { package = "hyper-calendar", version = "0.1.0", path = "../hyper-calendar", default-features = false, features = ["std"] }
