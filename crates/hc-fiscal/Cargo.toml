[package]
name = "hc-fiscal"
description = "Fiscal, tax and academic years for hyper-calendar: years that do not begin on 1 January."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true

[features]
default = ["std", "indic"]
std = ["alloc", "hc-core/std", "hc-calendar/std", "hc-calendars-solar/std", "hc-calendars-indic?/std"]
alloc = ["hc-core/alloc", "hc-calendar/alloc", "hc-calendars-solar/alloc", "hc-calendars-indic?/alloc"]
# Nepal's fiscal year, which begins on 1 Shrawan of the Bikram Sambat: the
# one start dated in a calendar of `hc-calendars-indic`, which brings the
# astronomy with it.
indic = ["dep:hc-calendars-indic"]
# Floating-point math for `no_std` builds: `hc-core` refuses to compile with
# neither `std` nor `libm`.
libm = ["hc-core/libm"]

[dependencies]
hc-core = { workspace = true }
hc-calendar = { workspace = true }
hc-calendars-solar = { workspace = true }
hc-calendars-indic = { workspace = true, optional = true }
