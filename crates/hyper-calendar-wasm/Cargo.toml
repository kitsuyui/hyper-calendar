[package]
name = "hyper-calendar-wasm"
description = "A dependency-free WebAssembly surface for hyper-calendar."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# The layers a page loads as it needs them. Every export is gated by one of
# these, and the README's table says which.
[features]
default = ["civil"]
# Proleptic Gregorian dates, ISO 8601 text, POSIX time and the TAI-UTC bridge.
civil = ["hc/civil", "hc/format"]
# Time-scale labels and day counts outside the civil calendar: TAI64
# labels, GNSS weeks, GLONASS dates, OLE Automation dates and Excel 1900
# serials. A layer of its own so that `civil`, the first a page paints
# with, does not carry their float formatting and 128-bit arithmetic.
timestamps = ["civil"]
# Every calendar the facade registers, described for one day in a locale.
calendars = ["civil", "hc/lunar", "hc/equinox", "hc/indic", "hc/regional", "hc/i18n"]
# The holiday tables: countries, exchanges, traditions and the UN days.
holiday = ["civil", "hc/holiday"]
# The 24 solar terms and the 72 pentads.
seasons = ["civil", "hc/seasons"]
# Cosmic, geologic and archaeological time.
deep-time = ["hc/deep-time"]
# The day by a time zone's wall clock: seventeen built-in zones, and any
# zone a page loads as TZif bytes.
tz = ["civil", "hc/tz"]
# The sky: where the Sun and Moon are at an instant, and the solar terms and
# the moon phases within a span, from hc-astro's series.
sky = ["civil", "hc/seasons"]
# The orbit: Earth's orbital elements and the June insolation at 65° N, a
# million years either side of 1950, from Berger's 1978 series.
orbital = ["hc/orbital"]
# Time on other bodies: Mars time and the Darian date, the surface
# missions' sol counts, and the solar day and local mean solar time of every
# body in hc-planetary's table.
planetary = ["hc/planetary"]
# Relativistic time dilation: a clock at a constant velocity, and one held
# still at a radius from a mass, from hc-relativity. A layer of its own, not
# part of `planetary`, because neither needs the other's crates.
relativity = ["hc/relativity"]
# Every layer.
full = ["civil", "timestamps", "calendars", "holiday", "seasons", "deep-time", "tz", "sky", "orbital", "planetary", "relativity", "hc/full"]

[dependencies]
hc = { package = "hyper-calendar", version = "0.1.0", path = "../hyper-calendar", default-features = false, features = ["std"] }
