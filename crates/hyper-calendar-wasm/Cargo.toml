[package]
name = "hyper-calendar-wasm"
description = "A dependency-free WebAssembly surface for hyper-calendar."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["civil"]
civil = ["hc/civil", "hc/format"]
holiday = ["hc/holiday"]
full = ["hc/full"]

[dependencies]
hc = { package = "hyper-calendar", version = "0.1.0", path = "../hyper-calendar", default-features = false, features = ["std"] }
