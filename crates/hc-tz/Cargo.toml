[package]
name = "hc-tz"
description = "Time zone support for hyper-calendar: fixed offsets, POSIX TZ rules and TZif (IANA) readers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true

[features]
default = ["std"]
std = ["alloc", "hc-core/std", "hc-calendar/std"]
alloc = ["hc-core/alloc", "hc-calendar/alloc"]

[dependencies]
hc-core = { workspace = true }
hc-calendar = { workspace = true }
