[package]
name = "hyper-calendar"
description = "A universal calendar and time library: every scale from Planck time to cosmology, every calendar we can model, on Earth and off it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true

[features]
default = ["std", "civil", "format", "i18n"]

# --- Build shape -----------------------------------------------------------
std = [
    "alloc",
    "hc-core/std",
    "hc-units?/std",
    "hc-calendar?/std",
    "hc-calendars-solar?/std",
    "hc-calendars-lunar?/std",
    "hc-calendars-equinox?/std",
    "hc-calendars-indic?/std",
    "hc-calendars-regional?/std",
    "hc-astro?/std",
    "hc-seasons?/std",
    "hc-almanac?/std",
    "hc-fiscal?/std",
    "hc-attributes?/std",
    "hc-name-days?/std",
    "hc-tz?/std",
    "hc-format?/std",
    "hc-i18n?/std",
    "hc-humanize?/std",
    "hc-holiday?/std",
    "hc-uncertainty?/std",
    "hc-deep-time?/std",
    "hc-orbital?/std",
    "hc-planetary?/std",
    "hc-relativity?/std",
]
alloc = [
    "hc-core/alloc",
    "hc-units?/alloc",
    "hc-calendar?/alloc",
    "hc-calendars-solar?/alloc",
    "hc-calendars-lunar?/alloc",
    "hc-calendars-equinox?/alloc",
    "hc-calendars-indic?/alloc",
    "hc-calendars-regional?/alloc",
    "hc-astro?/alloc",
    "hc-seasons?/alloc",
    "hc-almanac?/alloc",
    "hc-fiscal?/alloc",
    "hc-attributes?/alloc",
    "hc-name-days?/alloc",
    "hc-tz?/alloc",
    "hc-format?/alloc",
    "hc-i18n?/alloc",
    "hc-humanize?/alloc",
    "hc-holiday?/alloc",
    "hc-uncertainty?/alloc",
    "hc-deep-time?/alloc",
    "hc-orbital?/alloc",
    "hc-planetary?/alloc",
    "hc-relativity?/alloc",
]
# Floating-point math for `no_std`. A build with neither `std` nor `libm`
# is refused at compile time rather than panicking at run time.
libm = ["hc-core/libm"]

# --- Capability bundles ----------------------------------------------------
# Exactly defined units of time: SI, civil, horological, decimal,
# hexadecimal, media and musical.
units = ["dep:hc-units"]
# Civil dates: the Gregorian family plus the calendar abstraction; and,
# with `uncertainty`, the EDTF dates it places by that arithmetic.
civil = ["dep:hc-calendar", "dep:hc-calendars-solar", "hc-uncertainty?/edtf"]
# Lunar and lunisolar calendars, which need the astronomical engine.
lunar = ["civil", "dep:hc-astro", "dep:hc-calendars-lunar", "hc-core/memo"]
# Solar calendars judged by an equinox at a place: Solar Hijri, Badíʿ and
# French Republican computed astronomically.
equinox = ["astro", "dep:hc-calendars-equinox", "hc-core/memo"]
# The calendars of the Indian subcontinent: the Hindu lunisolar calendar,
# computed with the sidereal zodiac of hc-seasons; and, with `fiscal`,
# Nepal's fiscal year, which is dated in the Bikram Sambat.
indic = ["seasons", "dep:hc-calendars-indic", "hc-core/memo", "hc-fiscal?/indic"]
# Regional and cyclic calendars.
regional = ["lunar", "dep:hc-calendars-regional"]
# Astronomy on its own, for solar longitude and phases.
astro = ["civil", "dep:hc-astro"]
# The 24 solar terms, 72 pentads and zassetsu; and, with `attributes`,
# the zodiac-sign stones and the Harvest Moon.
seasons = ["astro", "dep:hc-seasons", "hc-attributes?/seasons"]
# The almanac annotations: mansions, nine stars, directs, selected days,
# named in a locale by hc-i18n.
almanac = ["seasons", "lunar", "i18n", "dep:hc-almanac"]
# Fiscal, tax and academic years; Nepal's with `indic`.
fiscal = ["civil", "dep:hc-fiscal"]
# Birthstones, birth flowers, moon names and traditional month names; the
# zodiac-sign stones and the Harvest Moon with `seasons`.
attributes = ["civil", "dep:hc-attributes"]
# Name-day lists: Latvia's vendored, and a loader for lists a caller has
# licensed.
name-days = ["civil", "dep:hc-name-days"]
# Time zones, and where each is: tzdata's zone locations, with CLDR's
# English exemplar city of each zone for `zone_lines`.
tz = ["civil", "dep:hc-tz", "dep:hc-i18n", "hc-i18n/exemplar-cities"]
# CLDR's exemplar cities of the zones in every locale hc-i18n carries, for
# `zone_lines`. Some 230 kB of text, so apart from `tz`: without it a
# zone's city is English's.
localized-exemplar-cities = ["dep:hc-i18n", "hc-i18n/localized-exemplar-cities"]
# CLDR 48's names of every territory and ISO 3166-2 subdivision in every
# locale hc-i18n carries, for `place_lines`. Some 2.8 MB, so a feature that
# nothing else turns on: `holiday` names its countries from its own,
# smaller table.
place-names = ["dep:hc-i18n", "hc-i18n/place-names"]
# ISO 8601 / RFC 3339 parsing and formatting; and, with `humanize`,
# Python `humanize`'s `naturalday` and `naturaldate`, which write a day
# with it.
format = ["civil", "dep:hc-format", "hc-humanize?/format"]
# The time zone names of the CLDR pattern fields `z`, `v` and `V`: CLDR 48's
# metazones and English's names. About 60 kB.
zone-names = ["format", "tz", "hc-format/zone-names"]
# Every other locale's zone names. Some 600 kB of text, so apart from
# `zone-names`: without it a locale other than English writes a zone by its
# offset, UTS #35's fallback.
localized-zone-names = ["zone-names", "localized-exemplar-cities", "hc-format/localized-zone-names"]
# Locales, plural rules and localised vocabulary.
i18n = ["civil", "dep:hc-i18n"]
# Human-readable relative times.
humanize = ["i18n", "dep:hc-humanize"]
# Holidays and religious observances, and CLDR's names for the countries
# the tables are kept for, which `holiday_lines` writes in a locale.
holiday = [
    "regional",
    "seasons",
    "equinox",
    "indic",
    "dep:hc-holiday",
    "dep:hc-i18n",
    "hc-i18n/territories",
]
# Jupiter's position, its entries into the sidereal signs, and the Kumbh
# Mela and Pushkaram found from them, from the VSOP87B series for Jupiter:
# some 55 kB of tables, which nothing else carries.
jupiter = [
    "seasons",
    "indic",
    "almanac",
    "format",
    "i18n",
    "hc-astro/jupiter",
    "hc-seasons/jupiter",
]
# Significant figures, error bars and fuzzy intervals.
uncertainty = ["dep:hc-uncertainty"]
# Planck time to cosmology.
deep-time = ["uncertainty", "dep:hc-deep-time"]
# Milankovitch orbital elements and insolation, a million years either side
# of 1950.
orbital = ["uncertainty", "dep:hc-orbital"]
# Mars sols and other bodies.
planetary = ["astro", "dep:hc-planetary"]
# Special and general relativistic time dilation.
relativity = ["uncertainty", "dep:hc-relativity"]

# Everything. Convenient for applications, wasteful for embedded targets.
full = [
    "units",
    "civil",
    "lunar",
    "equinox",
    "indic",
    "regional",
    "astro",
    "seasons",
    "almanac",
    "fiscal",
    "attributes",
    "name-days",
    "tz",
    "localized-exemplar-cities",
    "place-names",
    "format",
    "zone-names",
    "localized-zone-names",
    "i18n",
    "humanize",
    "holiday",
    "uncertainty",
    "deep-time",
    "orbital",
    "planetary",
    "jupiter",
    "relativity",
]

[dependencies]
hc-core = { workspace = true }
hc-units = { workspace = true, optional = true }
hc-calendar = { workspace = true, optional = true }
hc-calendars-solar = { workspace = true, optional = true }
hc-calendars-lunar = { workspace = true, optional = true }
hc-calendars-equinox = { workspace = true, optional = true }
hc-calendars-indic = { workspace = true, optional = true }
hc-calendars-regional = { workspace = true, optional = true }
hc-astro = { workspace = true, optional = true }
hc-seasons = { workspace = true, optional = true }
hc-almanac = { workspace = true, optional = true }
hc-fiscal = { workspace = true, optional = true }
hc-attributes = { workspace = true, optional = true }
hc-name-days = { workspace = true, optional = true }
hc-tz = { workspace = true, optional = true }
hc-format = { workspace = true, optional = true }
hc-i18n = { workspace = true, optional = true }
hc-humanize = { workspace = true, optional = true }
hc-holiday = { workspace = true, optional = true }
hc-uncertainty = { workspace = true, optional = true }
hc-deep-time = { workspace = true, optional = true }
hc-orbital = { workspace = true, optional = true }
hc-planetary = { workspace = true, optional = true }
hc-relativity = { workspace = true, optional = true }

# Each example needs only part of the library, and saying so keeps
# `cargo build --features <one thing>` from trying to compile all of them.
[[example]]
name = "kaei3"
required-features = ["lunar"]

[[example]]
name = "deep_time"
required-features = ["deep-time"]

[[example]]
name = "easter"
required-features = ["holiday"]

[[example]]
name = "holidays_on_timing"
required-features = ["holiday"]

[[example]]
name = "calendar_timing"
required-features = ["lunar", "equinox", "indic", "regional", "i18n", "format"]
