[package]
name = "hc-orbital"
description = "Milankovitch orbital elements for hyper-calendar: eccentricity, obliquity, the longitude of perihelion and daily insolation from Berger's 1978 trigonometric series, for a million years either side of 1950."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true

[features]
default = ["std"]
std = ["alloc", "hc-core/std", "hc-uncertainty/std"]
alloc = ["hc-core/alloc", "hc-uncertainty/alloc"]
# Floating-point math for `no_std` builds: `hc-core` refuses to compile with
# neither `std` nor `libm`.
libm = ["hc-core/libm"]

[dependencies]
hc-core = { workspace = true }
hc-uncertainty = { workspace = true }
