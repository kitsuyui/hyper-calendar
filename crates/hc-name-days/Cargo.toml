[package]
name = "hc-name-days"
description = "Name-day lists for hyper-calendar: each list a named edition of a named authority, with a loader for lists a caller has licensed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true

[features]
default = ["std"]
std = ["alloc", "hc-core/std", "hc-calendar/std"]
# The loader for caller-supplied lists needs an allocator; the vendored
# tables and the evaluator do not.
alloc = ["hc-core/alloc", "hc-calendar/alloc"]
# Floating-point math for `no_std` builds: `hc-core` refuses to compile with
# neither `std` nor `libm`.
libm = ["hc-core/libm"]

[dependencies]
hc-core = { workspace = true }
hc-calendar = { workspace = true }
