[package]
name = "hc-calendars-indic"
description = "The calendars of the Indian subcontinent for hyper-calendar: the Hindu lunisolar calendar computed from the Sun and Moon, with the sidereal zodiac of hc-seasons."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true

[features]
default = ["std"]
std = [
    "alloc",
    "hc-core/std",
    "hc-calendar/std",
    "hc-calendars-solar/std",
    "hc-astro/std",
    "hc-seasons/std",
]
alloc = [
    "hc-core/alloc",
    "hc-calendar/alloc",
    "hc-calendars-solar/alloc",
    "hc-astro/alloc",
    "hc-seasons/alloc",
]

[dependencies]
hc-core = { workspace = true }
hc-calendar = { workspace = true }
hc-calendars-solar = { workspace = true }
hc-astro = { workspace = true }
hc-seasons = { workspace = true }
