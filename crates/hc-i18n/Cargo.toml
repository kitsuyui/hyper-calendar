[package]
name = "hc-i18n"
description = "Internationalisation for hyper-calendar: BCP 47 locales, plural rules, numbering systems and localised calendar vocabulary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true

[features]
default = ["std"]
std = ["alloc", "hc-core/std", "hc-calendar/std"]
alloc = ["hc-core/alloc", "hc-calendar/alloc"]
# Floating-point math for `no_std` builds: `hc-core` refuses to compile with
# neither `std` nor `libm`.
libm = ["hc-core/libm"]
# CLDR 48's names for the 195 regions the workspace keeps holiday tables
# for, in every carried locale CLDR names them in (the `territories`
# module). About a hundred kilobytes of text, so off unless a caller names
# territories: the facade's `holiday` feature turns it on, and a build that
# only renders dates does not carry it.
territories = []

[dependencies]
hc-core = { workspace = true }
hc-calendar = { workspace = true }
