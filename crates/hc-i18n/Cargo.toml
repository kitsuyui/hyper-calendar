[package]
name = "hc-i18n"
description = "Internationalisation for hyper-calendar: BCP 47 locales, plural rules, numbering systems and localised calendar vocabulary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true

[features]
default = ["std"]
std = ["alloc", "hc-core/std", "hc-calendar/std"]
alloc = ["hc-core/alloc", "hc-calendar/alloc"]
# Floating-point math for `no_std` builds: `hc-core` refuses to compile with
# neither `std` nor `libm`.
libm = ["hc-core/libm"]
# CLDR 48's names of the 295 territories `en.xml` names, with their `alt`
# forms, in every carried locale CLDR names them in (the territory half of
# the `place_names` module). About 230 kB of text, so off unless a caller
# names territories: the facade's `holiday` feature and `zone-names` turn it
# on, and a build that only renders dates does not carry it.
territories = []
# CLDR 48's English exemplar cities for the 418 zones hc-tz locates, from
# en.xml and root.xml, and UTS #35's name derived from a zone's identifier
# for the rest (the `exemplar_cities` module). About 2 kB: the facade's
# `tz` feature turns it on.
exemplar-cities = []
# The exemplar cities in every other carried locale CLDR names them in.
# About 230 kB of text, so a feature of its own: the facade's
# `localized-exemplar-cities` feature turns it on, and a build that shows
# zones in English does not carry it.
localized-exemplar-cities = ["exemplar-cities"]
# CLDR 48's time zone data for the zone names of UTS #35 (the
# `zone_names` module): each zone's metazones, the golden, preferred and
# primary zones, the BCP 47 zone identifiers, the languages' likely
# regions, and English's metazone and zone names. About 60 kB; the
# exemplar cities and the territory names are the other half of a zone's
# location name, so it turns them on. `hc-format`'s `zone-names` feature
# turns it on.
zone-names = ["exemplar-cities", "territories"]
# The metazone and zone names of every other carried locale. About 600 kB of
# text, so a feature of its own: `hc-format`'s `localized-zone-names`.
localized-zone-names = ["zone-names", "localized-exemplar-cities"]
# CLDR 48's names of every ISO 3166-2 subdivision it names, in every
# carried locale, and which lies in which (the subdivision half of the
# `place_names` module). Some 2.6 MB, so a feature of its own that nothing
# else turns on: the facade's `place-names` feature, and the `places` layer
# of the WebAssembly module and the C library.
place-names = ["territories"]

[dependencies]
hc-core = { workspace = true }
hc-calendar = { workspace = true }
