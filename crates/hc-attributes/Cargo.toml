[package]
name = "hc-attributes"
description = "Cultural attributions to calendar units for hyper-calendar: birthstones, birth flowers, moon names and traditional month names, per naming authority."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true

[features]
default = ["std"]
std = ["alloc", "hc-core/std", "hc-calendar/std", "hc-seasons/std"]
alloc = ["hc-core/alloc", "hc-calendar/alloc", "hc-seasons/alloc"]
# Floating-point math for `no_std` builds: `hc-core` refuses to compile with
# neither `std` nor `libm`.
libm = ["hc-core/libm"]

[dependencies]
hc-core = { workspace = true }
hc-calendar = { workspace = true }
hc-seasons = { workspace = true }
