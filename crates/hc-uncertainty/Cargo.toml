[package]
name = "hc-uncertainty"
description = "Uncertain time for hyper-calendar: significant figures, error bars, fuzzy instants and interval arithmetic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true

[features]
default = ["std", "edtf"]
std = ["alloc", "hc-core/std", "hc-calendar?/std"]
alloc = ["hc-core/alloc", "hc-calendar?/alloc"]
# ISO 8601-2 Extended Date/Time Format, which places a date by the
# proleptic Gregorian arithmetic of `hc-calendar`.
edtf = ["dep:hc-calendar"]
# Floating-point math for `no_std` builds: `hc-core` refuses to compile with
# neither `std` nor `libm`.
libm = ["hc-core/libm"]

[dependencies]
hc-core = { workspace = true }
hc-calendar = { workspace = true, optional = true }
