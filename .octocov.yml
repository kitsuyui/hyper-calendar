# https://github.com/k1LoW/octocov?tab=readme-ov-file#configuration
coverage:
  acceptable: 70%
  paths:
    - coverage.lcov
codeToTestRatio:
  acceptable: 1:0.005
  code:
    - "crates/**/src/**/*.rs"
  test:
    - "crates/**/tests/**/*.rs"
    - "tests/**/*.rs"
testExecutionTime:
  if: true
  # Higher than a single-crate project would need, deliberately. This suite's
  # main evidence is exhaustive: the Japanese era calendar round-trips every
  # day from 862 to 2100, the lunar calendars tens of thousands of days each,
  # and the ISO 8601 parser every day from 1583 to 2400 through three date
  # forms in two formats. Under llvm-cov instrumentation that runs three to
  # five times slower than a plain `cargo test`.
  #
  # The threshold exists to catch a test that has started hanging, not to
  # pressure the sweeps into being sampled. If it is ever exceeded, check
  # which crate grew before lowering the coverage instead.
  #
  # It was briefly 25 minutes, to accommodate a Japanese sweep that walked
  # 452 000 days re-testing arithmetic another crate already validates. That
  # sweep now targets the seams instead and takes thirteen seconds rather than
  # six minutes, so the ceiling comes back down. Raising a limit to fit a test
  # that should not have been that slow is the wrong way round.
  #
  # Thirty minutes since September 2026, after that check was made and nothing
  # had grown. The plain `Test` job held between five and six and a half
  # minutes across twenty consecutive runs, while the instrumented time of the
  # same suite ranged from eight to twenty-three — one commit measured ten
  # minutes on one runner and twenty-two on another — and crossed fifteen on
  # three pull requests in a row. The limit sat inside a shared runner's
  # variance, so it now sits above it, and the job's own `timeout-minutes`
  # is the guard against a hang.
  #
  # One run of #148 still took 32m35s. The instrumented run is a debug
  # build, so the longest day-by-day sweeps now take a fixed sample of their
  # days there and walk every day only in the release-mode `sweeps` job of
  # tests.yml (docs/policy.md §7). That cut the suite's debug test time from
  # about 234 to 85 seconds on one machine, so the ceiling stays where it is.
  acceptable: 30min
diff:
  datastores:
    - artifact://${GITHUB_REPOSITORY}
comment:
  if: is_pull_request
  updatePrevious: true
report:
  if: is_default_branch
  datastores:
    - artifact://${GITHUB_REPOSITORY}
