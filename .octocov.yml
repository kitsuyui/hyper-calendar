# https://github.com/k1LoW/octocov?tab=readme-ov-file#configuration
coverage:
  acceptable: 70%
  paths:
    - coverage.lcov
codeToTestRatio:
  acceptable: 1:0.005
  code:
    - "crates/**/src/**/*.rs"
  test:
    - "crates/**/tests/**/*.rs"
    - "tests/**/*.rs"
testExecutionTime:
  if: true
  # Higher than a single-crate project would need, deliberately. This suite's
  # main evidence is exhaustive: every conversion round-trips over its whole
  # range. This job's run is an instrumented debug build, so the longest of
  # those sweeps take a fixed sample of their days and, where the years'
  # boundaries cost more than the days, every k-th year with k prime to the
  # calendar's cycle; the `sweeps` job of test.yml walks every day in
  # release mode (docs/policy.md §7). The tests that render every calendar
  # in every locale render a staggered share of the pairings, likewise.
  # Under llvm-cov instrumentation the suite runs three to five times slower
  # than a plain `cargo test`, and slower still on several threads, which
  # contend for the coverage counters: so this job runs one test at a time
  # and each sweep on one thread (.github/workflows/octocov.yml).
  #
  # The threshold exists to catch a test that has started hanging, not to
  # pressure the sweeps into being sampled further. If it is exceeded, check
  # which crate grew before lowering the coverage, and do not raise the
  # limit to fit a test that should not be that slow.
  #
  # It is thirty minutes because the instrumented time sits inside a shared
  # runner's variance: the plain `Test` job holds between five and six and a
  # half minutes, while the instrumented time of the same suite has ranged
  # from eight to twenty-three, and a run of this job, build included, has
  # measured about twenty minutes. On 27 September 2026, before it ran one
  # test at a time, two runs of nearly the same code measured 14m52s and
  # 31m38s, on runners one twice as fast as the other. The job's own
  # `timeout-minutes` is the guard against a hang.
  acceptable: 30min
diff:
  datastores:
    - artifact://${GITHUB_REPOSITORY}
comment:
  if: is_pull_request
  updatePrevious: true
report:
  if: is_default_branch
  datastores:
    - artifact://${GITHUB_REPOSITORY}
