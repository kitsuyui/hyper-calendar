[registries.crates-io]
protocol = "sparse"

[target.'cfg(all())']
rustflags = [
    "-Wclippy::fallible_impl_from",
    "-Dclippy::unwrap_used",
    "-Dclippy::expect_used",
]

[alias]
format = "fmt --all"
format-check = "fmt --all -- --check"
lint = "clippy --all-targets --all-features -- -D warnings"
lint-fix = "clippy --all-targets --all-features --fix --allow-dirty --allow-staged"
