# Run the same checks CI runs, before the mistake reaches a pull request.
#
# Every job here has a counterpart in .github/workflows/test.yml or
# spellcheck.yml. When a check is added there, add it here too: a gate that
# only exists on the server costs a round trip to discover.
#
# These hooks passing is necessary but not sufficient, and the reason is
# version skew. CI installs the *latest* stable Rust and the latest `typos`
# on every run, so both lint against newer rules than a local toolchain that
# has not been updated: a lint added in a newer Rust, or a word a newer
# `typos` knows, passes here and fails there.
#
# So before pushing anything substantial:
#
#     rustup update stable
#     cargo install typos-cli   # or: brew upgrade typos-cli
#
# The `versions` job below prints what is installed, so a stale toolchain is
# visible in the hook output rather than discovered in CI.
#
# Git hook environment variables are cleared first so that nested or sibling
# repositories are not affected: https://git-scm.com/docs/githooks

pre-commit:
  parallel: true
  jobs:
    - name: fmt
      run: for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do unset "$name"; done; cargo fmt --all -- --check
    - name: clippy
      run: for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do unset "$name"; done; cargo clippy --workspace --all-targets --all-features -- -D warnings
    # The spellcheck workflow runs from the repository root, and typos does
    # not merge nested configuration, so this must run from the root too.
    - name: typos
      run: typos

pre-push:
  parallel: true
  jobs:
    # Not a gate — a reminder. CI runs newer versions than these, so a local
    # pass does not guarantee a CI pass.
    - name: versions
      run: |
        printf 'local toolchain: '; rustc --version
        printf 'local typos:     '; typos --version
    - name: fmt
      run: for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do unset "$name"; done; cargo fmt --all -- --check
    - name: clippy
      run: for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do unset "$name"; done; cargo clippy --workspace --all-targets --all-features -- -D warnings
    - name: typos
      run: typos
    - name: test
      run: for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do unset "$name"; done; cargo test --workspace --all-features
    - name: doc
      run: for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do unset "$name"; done; RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features
    # The three build shapes CI checks. They catch a feature combination or a
    # target that the default build never exercises.
    - name: build-no-std
      run: for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do unset "$name"; done; cargo build -p hyper-calendar --no-default-features --features alloc,libm
    - name: build-no-std-crates
      run: for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do unset "$name"; done; for manifest in crates/hc-*/Cargo.toml; do crate=$(basename "$(dirname "$manifest")"); cargo build -p "$crate" --no-default-features --features alloc,libm || exit 1; done
    - name: build-wasm
      run: for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do unset "$name"; done; cargo build -p hyper-calendar-wasm --target wasm32-unknown-unknown
    - name: build-wasm-holiday
      run: for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do unset "$name"; done; cargo build -p hyper-calendar-wasm --target wasm32-unknown-unknown --features holiday
    - name: build-cdylib
      run: for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do unset "$name"; done; cargo build -p hyper-calendar-ffi
