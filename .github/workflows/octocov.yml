name: octocov
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  octocov:
    runs-on: ubuntu-latest
    # The hang guard: `testExecutionTime` in .octocov.yml is a ceiling on a
    # healthy run, not a timeout.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # One test at a time. Every thread of an instrumented binary
      # increments the same coverage counters, and threads that run the
      # same code fight over the cache lines that hold them. Measured on a
      # fourteen-core desktop on 28 September 2026, the lunar calendars'
      # unit tests took 275 s on four test threads and 144 s on one; the
      # sweeps' own threads are kept to one for the same reason
      # (`hc_core::sweep::INSTRUMENTED`).
      - run: |
          cargo install cargo-llvm-cov --version 0.8.5 --locked || true
          cargo llvm-cov --workspace --all-features --lcov --output-path coverage.lcov -- --test-threads=1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # See also: https://github.com/k1LoW/octocov-action
      - name: Report coverage with octocov
        uses: k1LoW/octocov-action@b3b6ee60482a667950f87553abf1df63217235d9 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          config: .octocov.yml
