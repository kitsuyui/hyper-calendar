name: tests
on:
  # pull-request events are not triggered when a PR is merged
  # push events are not triggered when a PR created from a fork repository
  # So we need both to run tests on every PR and after merging
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo check --workspace --all-features

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --workspace --all-features

  release-shards:
    name: List the release-mode shards
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.list.outputs.shards }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      # The one list scripts/release-shards.sh keeps, as a JSON array for the
      # matrix below, so that a shard added there runs here.
      - id: list
        run: echo "shards=$(scripts/release-shards.sh --json)" >> "$GITHUB_OUTPUT"

  sweeps:
    name: Test in release mode, with the full sweeps (${{ matrix.shard }})
    needs: release-shards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.release-shards.outputs.shards) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-${{ matrix.shard }}
      # A debug build, which the Test job and the instrumented coverage run
      # use, takes a fixed sample of the long day-by-day round trips; a
      # release build walks every day of them (docs/policy.md §7). Together
      # the shards are `cargo test --release --workspace --all-features`,
      # each test in exactly one: three crates' unit tests, which hold the
      # longest sweeps, have a shard each, the lunar crate's split in two by
      # test name, hyper-calendar's `written_dates` binary has one, and
      # `rest` runs every other test binary and the doctests,
      # so a new crate or test file is picked up there.
      # scripts/release-shards.sh --plan prints which shard runs what, and
      # checks that the split halves hold every test of the binary once.
      - run: scripts/release-shards.sh "${{ matrix.shard }}"

  no-std:
    name: Test without std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-unknown-none
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # `libm` as well as `alloc`: without one of `std` or `libm` there is no
      # floating-point math and the build is now refused outright. This job
      # runs the tests rather than only building, because a `no_std` build that
      # compiles and then fails at run time is exactly the bug this replaced.
      - run: cargo test -p hc-core --no-default-features --features alloc,libm
      - run: cargo build -p hyper-calendar --no-default-features --features alloc,libm
      # The line writers the boundary crates share, without `std`.
      - run: cargo build -p hyper-calendar --no-default-features --features alloc,libm,civil,i18n,format
      # Each crate on its own as well, for a target with no `std`, with and
      # without `alloc`: the facade enables features across the graph, so a
      # crate that cannot build alone passes there.
      - run: scripts/no-std-builds.sh
      # Each crate's tests with its optional dependencies off, which the
      # workspace test, built with every feature, never runs.
      - run: |
          for crate in hc-fiscal hc-attributes hc-uncertainty hc-humanize; do
            cargo test -p "$crate" --no-default-features --features std
          done

  wasm:
    name: Build for WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo build -p hyper-calendar-wasm --target wasm32-unknown-unknown --release
      - run: cargo build -p hyper-calendar-wasm --target wasm32-unknown-unknown --release --features holiday

  layer-list:
    name: List the layers
    runs-on: ubuntu-latest
    outputs:
      layers: ${{ steps.list.outputs.layers }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      # The one list scripts/layers.sh keeps, as a JSON array for the matrix
      # below, so that a layer added there is tested here with no second
      # list to keep.
      - id: list
        run: echo "layers=$(scripts/layers.sh --json)" >> "$GITHUB_OUTPUT"

  layers:
    name: Each layer on its own
    needs: layer-list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: ${{ fromJSON(needs.layer-list.outputs.layers) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.layer }}
      # The workspace jobs build with --all-features, which hides a layer
      # that does not build or pass without the others: the module for
      # wasm32 and both crates' tests with the layer's feature alone.
      - run: scripts/layer-tests.sh "${{ matrix.layer }}"

  wasm-js:
    name: Test the JavaScript binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      # Builds civil and full, then runs crates/hyper-calendar-wasm/js/*.test.js
      # under node --test with Node's built-ins alone.
      - run: scripts/wasm-js-test.sh

  wasm-artifacts:
    name: Build the WebAssembly artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      # Every layer with the release-compact profile, and the size table the
      # crate's README carries.
      - run: mkdir -p target/wasm-layers && scripts/wasm-layers.sh > target/wasm-layers/SIZES.md
      - run: cat target/wasm-layers/SIZES.md
      # Each layer within 5% of the README's table, so growth is noticed and
      # the table is refreshed on purpose.
      - run: scripts/wasm-size-check.sh
      # The binding with the full layer's bytes inside it, for a page opened
      # from disk.
      - run: node scripts/wasm-embed.mjs
      # The TZif files of the eighteen built-in zones, from the runner's
      # tzdata package, with the database release in VERSION.
      - run: scripts/wasm-tzdata.sh
      - run: cat target/tzdata/VERSION
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hyper-calendar-wasm
          if-no-files-found: error
          path: |
            target/wasm-layers/
            target/wasm-js/
            target/tzdata/
            crates/hyper-calendar-wasm/js/hyper-calendar.js
            crates/hyper-calendar-wasm/js/hyper-calendar.d.ts

  cdylib:
    name: Build the shared library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo build -p hyper-calendar-ffi --release
      - run: cargo build -p hyper-calendar-ffi --release --features holiday

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo fmt --all -- --check

  actionlint:
    uses: kitsuyui/gh-actions-workflows/.github/workflows/actionlint.yml@9108d679c02a52824376afcf071715fdaaa2a4e4 # main
    with:
      shellcheck: disabled

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit
